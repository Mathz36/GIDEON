name: Gideon CI/CD Quality & Security Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Quality & Security Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gideon_ci_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gideon_ci_test?schema=public
      GEMINI_API_KEY: ci-mock-gemini-api-key
      SANKHYA_SERVICE_URL: https://api.sankhya.ci.test/dbexplorer
      JWT_SECRET: ci-mock-jwt-secret-key-2026

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run Automated QA & Security Test Suites (RAG, LGPD, Hash & Sync)
        run: npx tsx --test src/__tests__/*.test.ts

  frontend-build-gate:
    name: Frontend Build & Type Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Vite Production Build
        run: npm run build
