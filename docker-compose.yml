services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gideon-backend
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3080
      HOST: "0.0.0.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gideon-frontend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - backend

  # Container opcional para quem NÃO possui PostgreSQL instalado na máquina
  # Para subir com banco embutido: docker compose --profile with-db up -d
  postgres:
    image: postgres:16-alpine
    container_name: gideon-postgres
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-gideon_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: gideon_postgres_data
